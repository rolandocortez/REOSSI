name: Public package checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set temporary output directories
        run: |
          echo "MPLCONFIGDIR=$RUNNER_TEMP/reossi-matplotlib" >> "$GITHUB_ENV"
          echo "REOSSI_SMOKE_DIR=$RUNNER_TEMP/reossi-public-smoke" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install public package and test extras
        run: python -m pip install '.[dev,mesh,plots]'

      - name: Check Python style
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

      - name: Run independent tests
        run: python -m pytest -q

      - name: Exercise virtual capture, replay and reconstruction
        run: |
          reossi simulate-scene \
            --config configs/synthetic_3d.json \
            --scene-config configs/scene_plane.json \
            --output "$REOSSI_SMOKE_DIR/scene" \
            --save-captures --max-sequence-mib 16 --max-triangle-tests 100000
          reossi replay \
            --config configs/synthetic_3d.json \
            --input "$REOSSI_SMOKE_DIR/scene/captures" \
            --output "$REOSSI_SMOKE_DIR/replay" \
            --layout runs --max-sequence-mib 16
          reossi reconstruct \
            --input "$REOSSI_SMOKE_DIR/replay" \
            --calibration "$REOSSI_SMOKE_DIR/scene/calibration.npz" \
            --output "$REOSSI_SMOKE_DIR/cloud" \
            --identifier-origin one --max-points 10000
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import numpy as np

          folder = Path(os.environ["REOSSI_SMOKE_DIR"])
          for name in ("h_pixels.npy", "v_pixels.npy"):
              np.testing.assert_array_equal(
                  np.load(folder / "scene" / name),
                  np.load(folder / "replay" / name),
              )
          points = np.load(folder / "cloud/pts_3d.npy")
          colors = np.load(folder / "cloud/colors.npy")
          assert points.shape[0] == 3 and points.shape[1] > 0
          assert colors.shape == (points.shape[1], 3)
          assert np.isfinite(points).all()
          metadata = json.loads((folder / "cloud/reconstruction.json").read_text())
          assert metadata["retained_points"] == points.shape[1]
          assert metadata["coordinate_frame"] == "camera"
          assert metadata["identifier_origin"] == 1
          assert (folder / "cloud/cloud.ply").is_file()
          PY
